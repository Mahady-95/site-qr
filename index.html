
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chorki QR Code Generator</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            color: #e50914;
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h2 {
            color: #222;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* URL Input */

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #333;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #e50914;
        }

        /* Generate Button */

        .generate-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 14px 25px;
            width: 100%;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 22px;
        }

        .generate-btn:hover {
            background: #c40812;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 10px;
            width: fit-content;
            margin: 0 auto 20px;
        }

        #qrcode img,
        #qrcode canvas {
            display: block;
        }

        .website {
            color: #555;
            font-size: 14px;
            margin-bottom: 22px;
            word-break: break-all;
        }

        .download-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 14px 25px;
            width: 100%;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #c40812;
        }

        .error {
            display: none;
            color: #e50914;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .footer {
            color: #999;
            font-size: 11px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">CHORKI</div>

        <h2>Scan & Explore Chorki</h2>

        <p class="description">
            Enter any website URL to generate a QR code.
        </p>

        <!-- URL Input Field -->

        <div class="input-group">

            <label for="websiteURL">Website URL</label>

            <input
                type="text"
                id="websiteURL"
                value="https://www.chorki.net/subscribe"
                placeholder="Enter website URL"
            >

        </div>

        <!-- Generate QR Button -->

        <button class="generate-btn" onclick="generateQR()">
            Generate QR Code
        </button>

        <p class="error" id="error"></p>

        <!-- QR Code -->

        <div id="qrcode"></div>

        <p class="website" id="website">
            https://www.chorki.net/subscribe
        </p>

        <!-- Download Button -->

        <button class="download-btn" onclick="downloadQR()">
            Download QR Code (PNG)
        </button>

        <p class="footer">
            © Chorki | Official Website QR Code
        </p>

    </div>

    <script>

        // Default destination URL

        let currentURL = "https://www.chorki.net/subscribe";


        // Generate QR Code

        function generateQR() {

            const input = document.getElementById("websiteURL");
            const qrContainer = document.getElementById("qrcode");
            const error = document.getElementById("error");

            let url = input.value.trim();

            error.style.display = "none";

            // Check empty input

            if (!url) {
                error.textContent = "Please enter a website URL.";
                error.style.display = "block";
                return;
            }

            // Automatically add HTTPS

            if (!/^https?:\/\//i.test(url)) {
                url = "https://" + url;
            }

            // Validate URL

            try {

                const parsedURL = new URL(url);

                if (
                    !["http:", "https:"].includes(parsedURL.protocol) ||
                    !parsedURL.hostname.includes(".")
                ) {
                    throw new Error("Invalid URL");
                }

                currentURL = parsedURL.href;

            } catch (e) {

                error.textContent = "Please enter a valid website URL.";
                error.style.display = "block";
                return;

            }

            // Clear previous QR

            qrContainer.innerHTML = "";

            // Generate new QR

            new QRCode(qrContainer, {
                text: currentURL,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Update displayed website URL

            document.getElementById("website").textContent = currentURL;

        }


        // Download QR Code as PNG

        function downloadQR() {

            const canvas = document.querySelector("#qrcode canvas");

            if (!canvas) {
                return;
            }

            const border = 30;
            const size = canvas.width + border * 2;

            const output = document.createElement("canvas");

            output.width = size;
            output.height = size;

            const ctx = output.getContext("2d");

            // White background

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, size, size);

            // Draw QR Code

            ctx.drawImage(canvas, border, border);

            // Black border

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 4;

            ctx.strokeRect(2, 2, size - 4, size - 4);

            // Download PNG

            const link = document.createElement("a");

            link.download = "Chorki-Permanent-QR.png";
            link.href = output.toDataURL("image/png");

            link.click();

        }


        // Generate default QR on page load

        generateQR();


        // Enter key support

        document.getElementById("websiteURL")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    generateQR();
                }

            });

    </script>

</body>

</html>
